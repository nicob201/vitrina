<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Zoom stays locked: after a rotation Chrome kept a 1.7x zoom and broke the layout. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A2142">
<title>vitrina</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-panel="clock">

<div class="corner"><span class="t" id="corner-time">--:--</span><span class="link" id="link"></span></div>

<section class="panel clock on" id="clock">
  <div class="weather" id="weather" hidden>
    <div class="now"><svg class="icon" aria-hidden="true"><use id="weather-icon" href=""></use></svg><b id="weather-temp"></b></div>
    <p class="sky" id="weather-sky"></p>
  </div>
  <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
  <div class="date">
    <span class="wd" id="wd"></span><span class="dm" id="dm"></span>
    <span class="offline-note" id="offline-note"></span>
  </div>
</section>

<section class="panel gh" id="github">
  <h2 id="gh-title"></h2>
  <div class="stats">
    <div class="stat"><b id="gh-total"></b><span id="gh-total-label"></span></div>
    <div class="stat"><b id="gh-streak"></b><span id="gh-streak-label"></span></div>
    <div class="stat"><b id="gh-today"></b><span id="gh-today-label"></span></div>
  </div>
  <div>
    <div class="months" id="gh-months"></div>
    <div class="grid" id="gh-grid"></div>
    <div class="key"><span id="gh-less"></span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span id="gh-more"></span></div>
  </div>
</section>

<section class="panel claude" id="claude">
  <h2 id="claude-title"></h2>
  <div class="meters">
    <div class="meter" id="claude-session">
      <span class="label" id="claude-session-label"></span>
      <b class="pct"><span id="claude-session-pct"></span><small>%</small></b>
      <div class="track"><div class="fill" id="claude-session-fill"></div></div>
      <p class="note" id="claude-session-note"></p>
    </div>
    <div class="meter" id="claude-week">
      <span class="label" id="claude-week-label"></span>
      <b class="pct"><span id="claude-week-pct"></span><small>%</small></b>
      <div class="track"><div class="fill" id="claude-week-fill"></div><i class="pace" id="claude-week-pace"></i></div>
      <p class="note"><span id="claude-week-note"></span><span class="pace-note" id="claude-week-pace-note"><br><span class="tick"></span><span id="claude-week-elapsed"></span></span></p>
    </div>
  </div>
</section>

<section class="panel mac" id="mac">
  <h2><span id="mac-name"></span> <span class="window" id="mac-window"></span></h2>
  <div class="mac-grid">
    <div class="mac-big">
      <div class="mac-card mac-cpu" id="mac-cpu">
        <div class="row"><i class="dot"></i><span id="mac-cpu-label"></span></div>
        <div class="num"><span id="mac-cpu-value"></span><small>%</small></div>
        <svg class="spark" id="mac-cpu-spark" aria-hidden="true"></svg>
      </div>
      <div class="mac-card mac-gpu" id="mac-gpu">
        <div class="row"><i class="dot"></i><span id="mac-gpu-label"></span></div>
        <div class="num"><span id="mac-gpu-value"></span><small>%</small></div>
        <svg class="spark" id="mac-gpu-spark" aria-hidden="true"></svg>
      </div>
      <div class="mac-card mac-ram" id="mac-ram">
        <div class="row"><i class="dot"></i><span id="mac-ram-label"></span><span class="r" id="mac-ram-of"></span></div>
        <div class="num"><span id="mac-ram-value"></span><small>%</small></div>
        <svg class="spark" id="mac-ram-spark" aria-hidden="true"></svg>
      </div>
      <div class="mac-card mac-net" id="mac-net">
        <div class="row"><i class="dot"></i><span id="mac-net-label"></span> ↓<span class="r"><i class="dot up"></i>↑ <span id="mac-up"></span></span></div>
        <div class="num"><span id="mac-down-value"></span><small id="mac-down-unit"></small></div>
        <svg class="spark" id="mac-net-spark" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="mac-smalls">
      <div class="mac-card mac-small mac-disk" id="mac-disk">
        <div class="row"><i class="dot"></i><span id="mac-disk-label"></span></div>
        <b id="mac-disk-free"></b>
        <div class="bar"><div class="fill" id="mac-disk-fill"></div></div>
        <em id="mac-disk-of"></em>
      </div>
      <div class="mac-card mac-small mac-battery" id="mac-battery">
        <div class="row"><i class="dot"></i><span id="mac-battery-label"></span></div>
        <b id="mac-battery-value"></b>
        <div class="bar"><div class="fill" id="mac-battery-fill"></div></div>
        <em id="mac-battery-state"></em>
      </div>
    </div>
  </div>
</section>

<section class="panel photo" id="photos">
  <img class="back" id="photo-back" alt="">
  <img class="main" id="photo-main" alt="">
</section>

<div class="progress" id="progress"></div>

<script src="app.js"></script>
</body>
</html>
