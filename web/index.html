<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Zoom stays locked: after a rotation Chrome kept a 1.7x zoom and broke the layout. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A2142">
<title>vitrina</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-panel="clock">

<div class="corner"><span class="t" id="corner-time">--:--</span><span class="link" id="link"></span></div>

<section class="panel clock on" id="clock">
  <div class="weather" id="weather" hidden>
    <div class="now"><svg class="icon" aria-hidden="true"><use id="weather-icon" href=""></use></svg><b id="weather-temp"></b></div>
    <p class="sky" id="weather-sky"></p>
  </div>
  <div class="time"><span id="hh">--</span><span class="colon">:</span><span id="mm">--</span></div>
  <div class="date">
    <span class="wd" id="wd"></span><span class="dm" id="dm"></span>
    <span class="offline-note" id="offline-note"></span>
  </div>
</section>

<section class="panel gh" id="github">
  <h2 id="gh-title"></h2>
  <div class="stats">
    <div class="stat"><b id="gh-total"></b><span id="gh-total-label"></span></div>
    <div class="stat"><b id="gh-streak"></b><span id="gh-streak-label"></span></div>
    <div class="stat"><b id="gh-today"></b><span id="gh-today-label"></span></div>
  </div>
  <div>
    <div class="months" id="gh-months"></div>
    <div class="grid" id="gh-grid"></div>
    <div class="key"><span id="gh-less"></span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span id="gh-more"></span></div>
  </div>
</section>

<section class="panel claude" id="claude">
  <h2 id="claude-title"></h2>
  <div class="meters">
    <div class="meter" id="claude-session">
      <span class="label" id="claude-session-label"></span>
      <b class="pct"><span id="claude-session-pct"></span><small>%</small></b>
      <div class="track"><div class="fill" id="claude-session-fill"></div></div>
      <p class="note" id="claude-session-note"></p>
    </div>
    <div class="meter" id="claude-week">
      <span class="label" id="claude-week-label"></span>
      <b class="pct"><span id="claude-week-pct"></span><small>%</small></b>
      <div class="track"><div class="fill" id="claude-week-fill"></div><i class="pace" id="claude-week-pace"></i></div>
      <p class="note"><span id="claude-week-note"></span><span class="pace-note" id="claude-week-pace-note"><br><span class="tick"></span><span id="claude-week-elapsed"></span></span></p>
    </div>
  </div>
</section>

<section class="panel photo" id="photos">
  <img class="back" id="photo-back" alt="">
  <img class="main" id="photo-main" alt="">
</section>

<div class="progress" id="progress"></div>

<script src="app.js"></script>
</body>
</html>
