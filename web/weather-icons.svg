<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!-- Line icons on a 48×48 grid. Stroke follows the text colour; sun and bolt use --sun.
       Clouds are filled with the background so whatever sits behind them is hidden. -->
  <symbol id="clear-day" viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g style="stroke: var(--sun, #D99A33)">
      <circle cx="24" cy="24" r="8"/>
      <path d="M24 6v4M24 38v4M6 24h4M38 24h4M11.3 11.3l2.8 2.8M33.9 33.9l2.8 2.8M11.3 36.7l2.8-2.8M33.9 14.1l2.8-2.8"/>
    </g>
  </symbol>

  <symbol id="clear-night" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37.9 25.56A14 14 0 1 1 22.44 10.09 11 11 0 0 0 37.9 25.56z"/>
  </symbol>

  <symbol id="partly_cloudy-day" viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g style="stroke: var(--sun, #D99A33)">
      <circle cx="18" cy="17" r="6"/>
      <path d="M18 5v3M6 17h3M9.5 8.5l2.1 2.1M26.5 8.5l-2.1 2.1M9.5 25.5l2.1-2.1"/>
    </g>
    <path stroke="currentColor" style="fill: var(--night, #1A2142)" d="M18 40h19a7 7 0 0 0 0-14 10 10 0 0 0-18.5-2A8 8 0 0 0 18 40z"/>
  </symbol>

  <symbol id="partly_cloudy-night" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25.5 16.85A8.68 8.68 0 1 1 15.91 7.26 6.82 6.82 0 0 0 25.5 16.85z"/>
    <path style="fill: var(--night, #1A2142)" d="M18 40h19a7 7 0 0 0 0-14 10 10 0 0 0-18.5-2A8 8 0 0 0 18 40z"/>
  </symbol>

  <symbol id="cloudy" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 36h21a8 8 0 0 0 0-16 11.5 11.5 0 0 0-21.5-2.5A9.5 9.5 0 0 0 14 36z"/>
  </symbol>

  <symbol id="fog" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 26h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 26z"/>
    <path d="M8 33h32M12 39h24"/>
  </symbol>

  <symbol id="drizzle" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 28h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 28z"/>
    <path d="M17 35v.5M24 37v.5M31 35v.5M20.5 41v.5M27.5 41v.5"/>
  </symbol>

  <symbol id="rain" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 28h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 28z"/>
    <path d="M18 34l-2 6M25 34l-2 6M32 34l-2 6"/>
  </symbol>

  <symbol id="snow" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 28h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 28z"/>
    <path d="M17 34v6M14.4 35.5l5.2 3M14.4 38.5l5.2-3M31 34v6M28.4 35.5l5.2 3M28.4 38.5l5.2-3"/>
  </symbol>

  <symbol id="storm" viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="currentColor" d="M14 28h21a7 7 0 0 0 0-14 10 10 0 0 0-19-2A8 8 0 0 0 14 28z"/>
    <path style="stroke: var(--sun, #D99A33)" d="M25 31l-5 7h7l-4 6"/>
  </symbol>
</svg>
